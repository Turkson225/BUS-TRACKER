name: Deploy Supabase backend
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: supabase-backend
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: supabase
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'lglwlqfgjqbbizbcrvzv' }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Validate account connection
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Add the SUPABASE_ACCESS_TOKEN repository secret.'; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo 'Add the SUPABASE_DB_PASSWORD repository secret.'; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo 'Add the SUPABASE_PROJECT_REF repository variable.'; exit 1; }
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - run: supabase db push
      - run: supabase functions deploy transport --project-ref "$SUPABASE_PROJECT_REF"
